services:
  postgres:
    image: postgres:17-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio_backend
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio_local_password
    ports:
      - "55432:5432"
    volumes:
      - portfolio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio_backend"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  portfolio_postgres_data:
